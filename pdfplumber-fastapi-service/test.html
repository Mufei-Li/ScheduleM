<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 解析本地测试</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    button { padding: 8px 14px; }
    pre { background: #f7f7f7; padding: 12px; border: 1px solid #ddd; border-radius: 6px; max-height: 60vh; overflow: auto; }
    label { font-weight: 600; }
    input[type="text"] { width: 420px; padding: 6px 8px; }
  </style>
</head>
<body>
  <h1>PDF 解析本地测试</h1>
  <div class="row">
    <label for="endpoint">后端地址</label>
    <input id="endpoint" type="text" value="http://127.0.0.1:3001/api/parse-pdf" />
  </div>
  <div class="row">
    <input id="pdfInput" type="file" accept=".pdf" />
    <button id="uploadBtn">上传并解析</button>
  </div>
  <h3>返回结果</h3>
  <pre id="output"></pre>
  <script src="index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const endpointInput = document.getElementById('endpoint');
      const original = window.uploadAndParsePdf;
      window.uploadAndParsePdf = async function(file, endpoint) {
        const ep = endpoint || (endpointInput && endpointInput.value) || 'http://127.0.0.1:3001/api/parse-pdf';
        return original(file, ep);
      };
    });
  </script>
</body>
</html>
